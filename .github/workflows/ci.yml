name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile (fast syntax/import-shape check)
        run: python -m py_compile app/main.py app/dependencies.py $(find app -name "*.py")

      - name: Run test suite
        run: pytest tests/ -v

      - name: Boot check (the app must actually start, not just import)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8123 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sSf http://127.0.0.1:8123/health >/dev/null 2>&1; then
              echo "Server is up."
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server never became healthy."
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push — just proves the Dockerfile still works)
        run: docker build -t roamwise-api:ci .
